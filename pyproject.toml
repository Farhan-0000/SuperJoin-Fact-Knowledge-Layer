[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fact-knowledge-layer"
version = "0.1.0"
description = "A Fact Knowledge Layer that extracts, normalizes, and reconciles facts from PDF documents with full provenance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "aiosqlite>=0.20,<1",
    "PyMuPDF>=1.24,<2",
    "openai>=1.30,<2",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
]
ui = [
    "streamlit>=1.36,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
